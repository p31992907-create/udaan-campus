name: Firestore Rules CI

on:
  push:
    paths:
      - 'firestore.rules'
      - 'test/**'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'test/**'

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install dependencies
      run: |
        npm ci
    - name: Run Firestore rules tests
      run: |
        npm test

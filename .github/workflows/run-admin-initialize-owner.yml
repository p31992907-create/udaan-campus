name: Run Admin Initialize Owner

on:
  workflow_dispatch: {}

jobs:
  initialize-owner:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write service account key
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is empty"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > service-account.json

      - name: Verify service account file
        run: |
          if [ ! -f service-account.json ]; then
            echo "service-account.json not found"
            exit 1
          fi
          ls -l service-account.json
          head -n 5 service-account.json

      - name: Install and run admin init
        run: |
          cd functions/admin_set_super_manager
          npm ci
          npm run verify-auth
          npm run check-firestore || true
          npm run initialize-owner

      - name: Cleanup
        if: always()
        run: |
          rm -f service-account.json
